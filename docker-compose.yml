version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: inventai_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/inventory_ai.db
      - SECRET_KEY=smart-inventory-super-secret-key-2026-softcomputing-aiml
    volumes:
      - ./data:/app/data
      - ./ml/models:/app/ml/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventai_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
